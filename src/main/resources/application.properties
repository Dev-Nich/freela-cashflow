spring.application.name=freela-cashflow
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/freela_cashflow}

server.port=${SERVER_PORT:8080}

security.jwt.secret=${SECURITY_JWT_SECRET:freela-cashflow-development-secret-change-me}
security.jwt.issuer=${SECURITY_JWT_ISSUER:freela-cashflow}
security.jwt.expiration-seconds=${SECURITY_JWT_EXPIRATION_SECONDS:86400}
